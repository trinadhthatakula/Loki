name: CodeQL

# Static security analysis, results in the repository's Security tab.
#
# One language, `java-kotlin`, because that is all Loki has: an Android app and a
# handful of shell scripts. There is no web surface, no Gradle plugin written in
# another language, and CodeQL has no shell analyser — the scripts are covered by
# shellcheck at style level in pr-ci.yml instead, which is the right tool for them.
# Adding a second language here is a two-line change if that ever stops being true;
# see the note on the matrix below.
on:
  # Scoped to the two long-lived branches, because this is what populates the
  # Security tab's baseline — the set of alerts a PR is diffed against. Analysing
  # every branch push would churn it for no gain.
  push:
    branches: [ "master", "dev" ]
  # NOT scoped by base, and `edited` is in the types. Both for the reasons written
  # out at the top of pr-ci.yml, which apply here word for word: a PR stacked on a
  # feature branch would otherwise get no analysis at all, and a retargeted PR would
  # keep an analysis of a merge into a branch that is no longer its base. Naming any
  # type replaces the default set rather than extending it, so the three defaults
  # are restated.
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  # The weekly run is not redundant with the two above. CodeQL's query packs are
  # updated continuously, so a scheduled analysis finds newly-published queries
  # against code that has not changed — which is most of the code, most of the time.
  # Off-hours and off-the-hour, to avoid the top-of-hour scheduling backlog that
  # makes cron runs on GitHub start late.
  schedule:
    - cron: '41 3 * * 1' # weekly, Monday 03:41 UTC

# The event name is part of the group, not decoration. A `schedule` run executes on
# the default branch, so its `github.ref` is `refs/heads/master` — byte-identical to
# the ref of a push to master. Without the event name those two share a group, and
# `cancel-in-progress` then kills whichever started first. Losing the scheduled run
# is the bad half of that trade: it exists precisely to run newly-published queries
# against code that has not changed, so cancelling it drops coverage no other trigger
# will produce, and it does so silently — a cancelled run is not a failed one and
# nothing reports it. PR refs (`refs/pull/N/merge`) never collided; this is only
# about schedule versus push.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # The one permission that matters here: without it the analysis runs and then
      # fails to upload, which reads as a broken workflow rather than as a missing
      # grant.
      security-events: write
      contents: read
      # Needed to read the workflow run's own metadata on private repositories. Free
      # to keep on a public one and one less thing to debug if visibility changes.
      actions: read
    strategy:
      # A single-entry matrix, kept rather than inlined. It is what makes adding a
      # language a one-stanza edit instead of a restructure, and `fail-fast: false`
      # below is then already correct: one language failing to build a database must
      # not cancel the other's analysis and hide its findings.
      fail-fast: false
      matrix:
        include:
          # build-mode: manual, and it has to be.
          #
          # `build-mode: none` is the cheap option — CodeQL extracts from source
          # without running Gradle — and it is what Thor uses. It does not work here,
          # because buildless extraction is a **Java-only** feature: it does not read
          # Kotlin. Thor gets away with it only because two stray `.java` files are
          # enough to produce a non-empty database; its 400-odd Kotlin files are
          # silently not analysed. Loki has zero `.java` files, so `none` produced an
          # empty database and `codeql database finalize` exited 32 with "CodeQL could
          # not process any code written in Java/Kotlin" — a red check on every PR.
          #
          # So the Kotlin compiler has to actually run, with CodeQL's tracer wrapped
          # around it — and "the task ran" is not the same claim as "the compiler ran",
          # which is a second trap the build step below deals with at length.
          # `:app:compileDebugKotlin` is the smallest task that does that.
          # There is no KSP and no kapt in this project, so a fuller `assembleDebug`
          # would extract nothing this task misses — it would only add R8, lint,
          # packaging and resource processing to every analysis, none of which
          # contribute code to the database.
          #
          # Note `paths`/`paths-ignore` in a CodeQL config apply to interpreted
          # languages only. A path filter here would be silently ignored, not
          # rejected — which is exactly the kind of configuration that looks like it
          # is working. So there is none.
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Nothing here performs an authenticated git operation, and CodeQL's
          # extractors run third-party code over the tree.
          persist-credentials: false

      # Before init, so that the JDK the build will use is already the one on PATH
      # when CodeQL sets up tracing around it.
      #
      # `cache: 'gradle'` restores ~/.gradle/caches, and that directory contains TWO
      # different things: the dependency cache (modules-2), which is a pure download
      # saving and is why this is enabled at all, and the build cache (build-cache-1),
      # which stores task OUTPUTS and will happily satisfy a compile without compiling.
      # The second one breaks this workflow — see the build step below, which disables
      # it explicitly rather than giving up the first one.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Everything between init and analyze runs inside CodeQL's tracer, which is the
      # only reason this step exists — the compiled output is thrown away. What CodeQL
      # records is the compiler ACTUALLY RUNNING, so every flag here exists to guarantee
      # that it does. A build that succeeds without compiling is the failure mode.
      #
      # `--no-daemon`: a reused Gradle daemon is a long-lived process that can pre-date
      # the tracer, and compilation inside one is compilation CodeQL never sees. The
      # Kotlin compile daemon is a child of this traced process, so it is traced normally.
      #
      # `--no-build-cache`: load-bearing, and the reason this workflow was previously
      # non-deterministic. gradle.properties sets `org.gradle.caching=true`, and the step
      # above restores build-cache-1, so on any run where the cache already held this
      # tree Gradle satisfied :app:compileDebugKotlin FROM-CACHE — no compiler process,
      # no traced compilation, empty database, `database finalize` exit 32 with "CodeQL
      # could not process any code written in Java/Kotlin". Commit e961ee3 demonstrated
      # it precisely: the same commit passed in 3m52s with a cold cache and failed in 2s
      # eight minutes later with a warm one. The check therefore passed the FIRST time on
      # any new tree and failed on every re-run, which is worse than failing outright.
      - name: Build Kotlin for the CodeQL database
        run: |
          set -euo pipefail
          chmod +x gradlew
          log="$RUNNER_TEMP/kotlin-compile.log"
          ./gradlew :app:compileDebugKotlin \
            --no-daemon --no-build-cache --console=plain --stacktrace 2>&1 | tee "$log"

          # Assert the compile genuinely EXECUTED. A cached, up-to-date or source-less
          # task exits 0 and leaves identical class files behind, so nothing before
          # `analyze` would notice — and `analyze` reports it as a generic exit 32 that
          # says nothing about the cause. This turns that into a named failure at the
          # step that caused it.
          task='> Task :app:compileDebugKotlin'
          if ! grep -qF "$task" "$log"; then
            echo "::error::':app:compileDebugKotlin' never appeared in the Gradle task log, so no Kotlin was compiled under CodeQL's tracer and the database will be empty. Did the task name change?" >&2
            exit 1
          fi
          if grep -qE "^${task} (FROM-CACHE|UP-TO-DATE|NO-SOURCE)\$" "$log"; then
            echo "::error::':app:compileDebugKotlin' did not execute — Gradle reported $(grep -oE "^${task} .*\$" "$log" | head -n 1 | awk '{print $NF}'). The Kotlin compiler never ran, so CodeQL traced nothing and 'database finalize' would exit 32. --no-build-cache is set, so if you are seeing this, something else is short-circuiting the task." >&2
            exit 1
          fi
          echo "':app:compileDebugKotlin' executed — the tracer saw a real compile."

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          # The category namespaces this run's results. Required the moment a second
          # analysis exists in the repo — without it, two uploads overwrite each
          # other's alert set rather than adding to it. Set now so that adding one
          # cannot silently erase this one's findings.
          category: "/language:${{ matrix.language }}"
