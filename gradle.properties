# -----------------------------------------------------------------------------
# PERFORMANCE (THE BASICS)
# -----------------------------------------------------------------------------
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# -----------------------------------------------------------------------------
# MEMORY TUNING (UPDATED FOR RESPONSIVENESS)
# -----------------------------------------------------------------------------
# Switched to G1GC based on your preference for system responsiveness.
# G1GC handles large heaps better and avoids long "stop-the-world" pauses.
# Note: G1GC performs best with more breathing room.
# If you have 32GB RAM, bump this to -Xmx6g or -Xmx8g.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g
# Kotlin Daemon: Separate from Gradle daemon.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC
# -----------------------------------------------------------------------------
# R8 / SHRINKER OPTIMIZATIONS (RUTHLESS)
# -----------------------------------------------------------------------------
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.enableR8.fullMode=true
# -----------------------------------------------------------------------------
# KOTLIN & COMPOSE (KOTLIN 2.0 ERA)
# -----------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
# -----------------------------------------------------------------------------
# KSP (SINCE YOU USE KOIN)
# -----------------------------------------------------------------------------
ksp.incremental=true
# ksp.use.k2=true
# -----------------------------------------------------------------------------
# ANDROID BUILD FEATURES
# -----------------------------------------------------------------------------
android.nonTransitiveRClass=true
android.useAndroidX=true
# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
org.gradle.warning.mode=all
org.gradle.welcome=never
# -----------------------------------------------------------------------------
# VERSIONING — the single source of truth
# -----------------------------------------------------------------------------
# One integer drives both versionCode and versionName. The name is DERIVED:
#
#   10000 -> 1.0.0      code/10000 . (code%10000)/100 . code%100
#   10001 -> 1.0.1
#   10100 -> 1.1.0
#   20000 -> 2.0.0
#
# Two digits per segment, not Thor's one, because Loki's first published APK
# already carried code 10000. Narrowing to Thor's code/1000 scheme would mean
# emitting 1000 for 1.0.0 — a versionCode DECREASE, which Android refuses to
# install over an existing build. The wider space also just fits an app that
# expects more patch releases than minor ones.
#
# versionName is intentionally absent from this file. Never set it by hand;
# `calculateVersionName()` in app/build.gradle.kts owns it, and
# .github/scripts/detect-version-bump.sh re-derives the same value in CI —
# a hand-set name would make the two disagree.
#
# Bumping versionCode is what makes a push a release. A push that leaves it
# alone still builds and verifies but publishes nothing.
# See docs/branching-and-releases.md.
versionCode=10001
