[versions]
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
odin = "1.0.0"
accompanistDrawablepainter = "0.37.3"
kotlinx-serialization-json = "1.11.0"
# Odin exposes coroutines through `api()`, so this pin is what stops Loki from silently
# tracking whatever version Odin happens to ship. Keep it deliberate.
kotlinxCoroutines = "1.11.0"
material3 = "1.5.0-alpha26"
# Asgard UI. Note this is what sets Loki's `minSdk` floor at 28 — see the comment on `minSdk`
# in app/build.gradle.kts before lowering either number.
asgardUi = "2.0.0"
splashscreen = "1.2.0"
# Navigation 3 and DataStore both need explicit versions: the Compose BOM contains only
# `androidx.compose*` groups, so it manages neither these nor the lifecycle artifacts.
# Both pins match Thor's.
navigation3 = "1.1.6"
datastorePreferences = "1.2.1"
koinAndroid = "4.2.2"
shizuku = "13.1.5"

[libraries]
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
accompanist-drawablepainter = { module = "com.google.accompanist:accompanist-drawablepainter", version.ref = "accompanistDrawablepainter" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# Material Icons Extended. Frozen upstream at 1.7.8 and no longer developed, but it is still the
# only complete Material glyph set available to Compose, and the alternative is hand-porting
# Material Symbols vector XML per icon. Deliberately NOT a transitive of Asgard UI: Asgard hand-
# builds the one glyph it needs so that consuming apps are not forced into this dependency — the
# choice belongs to the app, and Loki makes it here. BOM-managed, so no version ref.
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Asgard UI — the shared Compose component library, extracted from Thor's design system. Theme
# agnostic: every colour, type and shape comes from the host MaterialTheme, so there is no
# AsgardTheme to install. The coordinate is the KMP root module, which redirects Android
# consumers to `asgard-android`; depend on the root, not the platform artifact.
asgard = { module = "com.trinadhthatakula:asgard", version.ref = "asgardUi" }
#Root — Odin, the Kotlin-first coroutine root shell (replaced libsu 6.0.0)
odin = { module = "com.trinadhthatakula:odin", version.ref = "odin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
#Navigation 3 — typed, @Serializable NavKey back stack (see docs/review-anon-contribution.md §10.4)
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
# Scopes a ViewModel to a NavEntry instead of the Activity. Shipped on the lifecycle release
# train, not navigation3's, so it takes the lifecycle ref despite being a nav artifact.
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
#DataStore — the theme store, replacing the contribution's SharedPreferences
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
#Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinAndroid" }
#Shizuku
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

